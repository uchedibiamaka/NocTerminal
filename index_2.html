<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NocTerminal</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="NocTerminal">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#100C1F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0B0E13;--hd:#0F131A;--card:#121821;--line:#222A35;--in:#0E131A;--tx:#E6EAF0;--mu:#9AA4B2;--bl:#7FB2FF;--pri:#1F6FEB;--up:#2EC4A6;--dn:#FF8A4C;--y:#F2C94C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px Inter,system-ui,sans-serif}
a{color:var(--bl)}
.mono{font-family:"JetBrains Mono",monospace}
header{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--hd);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em}
.tag{font:11px "JetBrains Mono",monospace;color:var(--mu);border:1px solid #2A3340;border-radius:4px;padding:2px 6px}
nav{display:flex;flex-wrap:wrap;gap:4px;flex:1 1 auto}
nav button{background:none;border:0;color:var(--mu);font:500 13px Inter;padding:9px 12px;border-radius:6px;cursor:pointer;min-height:40px}
nav button.on{background:#1B2330;color:var(--tx)}
.kpis{display:flex;flex-wrap:wrap;gap:14px;font:12px "JetBrains Mono",monospace;color:var(--mu)}
.kpis b{color:var(--tx);font-weight:500}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
main{max-width:1440px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.grow{flex:999 1 560px}.side{flex:1 1 320px}
h1{margin:0;font-size:22px}h2{margin:0 0 10px;font-size:15px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--mu);text-transform:uppercase}
.big{font:26px "JetBrains Mono",monospace;margin-top:4px}
.btn{background:#1B2330;color:var(--tx);border:1px solid #2A3340;border-radius:8px;padding:11px 14px;font:600 13px Inter;cursor:pointer;min-height:44px}
.btn.pri{background:var(--pri);border-color:var(--pri)}.btn.warn{background:#3A1E12;color:#FFB48C;border-color:#5A2E1A}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mu);font-weight:500;text-align:left;padding:8px;white-space:nowrap}
td{padding:9px 8px;border-top:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.muted{color:var(--mu)}.pos{color:var(--up)}.neg{color:var(--dn)}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cell{background:var(--in);border:1px solid #1A212C;border-radius:8px;padding:8px;min-height:96px}
.cell.today{border-color:var(--pri)}
.ev{margin-top:6px;font-size:11px;line-height:1.35;cursor:pointer}
.sec-h{display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:none;border:0;color:var(--tx);font:600 15px Inter;width:100%;padding:0;min-height:36px}
.bars{display:flex;align-items:flex-end;gap:12px;height:130px;margin-top:14px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.meter{background:var(--in);border-radius:4px;height:10px}.meter span{display:block;height:10px;border-radius:4px}
.tl-row{width:100%;display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:none;border:0;color:var(--tx);font:inherit;text-align:left;padding:14px 16px;cursor:pointer}
.chart{width:100%;display:block;background:var(--in);border-radius:8px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--mu);margin-top:8px}
label.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
label.tg input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri)}
label.tg input[type=text]{width:80px;background:var(--in);color:var(--tx);border:1px solid #2A3340;border-radius:6px;padding:9px;font:13px "JetBrains Mono";text-align:right}
.empty{color:var(--mu);font-size:13px;padding:10px 0}
.banner{background:#2A1E0E;border:1px solid #5A3E1A;color:#FFD9A8;border-radius:8px;padding:10px 14px;font-size:13px}
@media(max-width:700px){.grid5{grid-template-columns:repeat(1,minmax(0,1fr))}.cal-wrap{overflow-x:auto}.grid7{min-width:760px}}
</style>
</head>
<body>
<header>
  <div class="brand"><svg width="24" height="24" viewBox="0 0 200 200" aria-hidden="true" style="flex:none"><defs><linearGradient id="nmh" gradientUnits="userSpaceOnUse" x1="20" y1="20" x2="180" y2="180"><stop offset="0" stop-color="#DDD6FE"/><stop offset="1" stop-color="#6D28D9"/></linearGradient></defs><line x1="56" y1="22" x2="56" y2="178" stroke="url(#nmh)" stroke-width="6" stroke-linecap="round"/><rect x="38" y="44" width="36" height="120" rx="6" fill="url(#nmh)"/><line x1="70" y1="54" x2="130" y2="146" stroke="url(#nmh)" stroke-width="22" stroke-linecap="round"/><line x1="144" y1="22" x2="144" y2="178" stroke="url(#nmh)" stroke-width="6" stroke-linecap="round"/><rect x="126" y="36" width="36" height="120" rx="6" fill="url(#nmh)"/></svg>NOCTERMINAL <span class="tag" id="acct">DEMO</span></div>
  <nav id="nav" aria-label="Sections"></nav>
  <div class="kpis"><span>Equity <b id="k-eq">-</b></span><span>Day DD <b id="k-dd">-</b></span><span id="k-st"></span><button class="btn" style="min-height:32px;padding:6px 10px" onclick="signOut()">Sign out</button></div>
</header>
<main id="app"></main>
<div id="login" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:20;align-items:center;justify-content:center;padding:20px">
 <form id="lf" class="card" style="width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px" onsubmit="event.preventDefault();signIn()">
  <div style="display:flex;align-items:center;gap:12px"><svg width="40" height="40" viewBox="0 0 200 200" aria-hidden="true" style="flex:none"><defs><linearGradient id="nml" gradientUnits="userSpaceOnUse" x1="20" y1="20" x2="180" y2="180"><stop offset="0" stop-color="#DDD6FE"/><stop offset="1" stop-color="#6D28D9"/></linearGradient></defs><line x1="56" y1="22" x2="56" y2="178" stroke="url(#nml)" stroke-width="6" stroke-linecap="round"/><rect x="38" y="44" width="36" height="120" rx="6" fill="url(#nml)"/><line x1="70" y1="54" x2="130" y2="146" stroke="url(#nml)" stroke-width="22" stroke-linecap="round"/><line x1="144" y1="22" x2="144" y2="178" stroke="url(#nml)" stroke-width="6" stroke-linecap="round"/><rect x="126" y="36" width="36" height="120" rx="6" fill="url(#nml)"/></svg><h1 style="margin:0">NocTerminal</h1></div><div class="muted" style="font-size:13px">Sign in with your terminal account.</div>
  <label class="lbl" for="le">Email</label><input id="le" type="email" autocomplete="username" required style="background:var(--in);color:var(--tx);border:1px solid #2A3340;border-radius:8px;padding:12px;font:15px Inter">
  <label class="lbl" for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required minlength="8" style="background:var(--in);color:var(--tx);border:1px solid #2A3340;border-radius:8px;padding:12px;font:15px Inter">
  <button class="btn pri" type="submit">Sign in</button>
  <button class="btn" type="button" onclick="signUp()">First time? Create the account</button>
  <div id="lmsg" class="muted" style="font-size:13px"></div>
 </form>
</div>
<script>
const TABS=[["pf","Portfolio"],["all","Trade log"],["sc","Scalper"],["rs","RSI(2)"],["gi","Gold inside-day"],["ov","News & Cover"]];
const NCSUB=[["ov","Overview"],["cal","Calendar"],["ev","Event"],["log","Trades"],["live","Live charts"],["shadow","Shadow"],["set","Settings"]];
const isNC=k=>NCSUB.some(([x])=>x===k);
let S=null, tab=location.hash.slice(1)||"pf", selRel=null, openTrade=null, liveOnlyOpen=false, calOpen={m:true,w:true,d:true}, snapCache={};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CC={USD:"#7FB2FF",EUR:"#B9A3FF",GBP:"#FFB48C",JPY:"#F2C94C",AUD:"#2EC4A6",CAD:"#FF9AA2",NZD:"#7DD3FC"};
function off(){return (S&&S.status&&S.status.utc_offset)?+S.status.utc_offset:7200}
function srvDate(t){ if(!t) return null; const m=t.match(/(\d{4})\.(\d{2})\.(\d{2}) (\d{2}):(\d{2})(?::(\d{2}))?/); if(!m) return null;
  return new Date(Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0))-off()*1000); }
const fmt=(d,o)=>d?d.toLocaleString(undefined,o||{weekday:"short",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"-";
const hm=d=>d?d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}):"";
const nyt=d=>d?d.toLocaleTimeString("en-US",{timeZone:"America/New_York",hour:"2-digit",minute:"2-digit",hour12:false}):"";
const num=(v,d=2)=>v===""||v==null||isNaN(+v)?"-":(+v).toFixed(d);
async function cmd(c,arg="",ea="NC"){ const nm={NC:"News & Cover",SC:"Burst Scalper",RS:"RSI(2)",GI:"Gold inside-day"}[ea];
  if(c==="CLOSE_ALL"&&!confirm("Close every "+nm+" position"+(ea==="NC"?" and cancel pending covers":"")+"?")) return;
  const {error}=await SB.from("term_commands").insert({ea,cmd:c,arg:String(arg||"")}); if(error) alert("Command failed: "+error.message); setTimeout(load,2500); }
function navDraw(){ $("#nav").innerHTML=TABS.map(([k,n])=>`<button class="${(k===tab||(k==="ov"&&isNC(tab)))?"on":""}" onclick="go('${k}')">${n}</button>`).join(""); }
function ncSub(){ return `<nav aria-label="News &amp; Cover sections" style="margin:0 0 14px;padding:4px;border:1px solid var(--line);border-radius:8px;flex:none">${NCSUB.map(([k,n])=>`<button class="${k===tab?"on":""}" onclick="go('${k}')">${n}</button>`).join("")}</nav>`; }
function go(k){ tab=k; location.hash=k; navDraw(); draw(); }
// ---------- candlestick SVG
function candles(rows,opt){ opt=opt||{}; const W=opt.W||600,H=opt.H||230; if(!rows||!rows.length) return `<div class="empty">No candle data yet.</div>`;
  const pts=rows.map(r=>({t:srvDate(r.time_server),o:+r.open,h:+r.high,l:+r.low,c:+r.close}));
  let lo=Math.min(...pts.map(p=>p.l)),hi=Math.max(...pts.map(p=>p.h)); (opt.lines||[]).forEach(l=>{if(l.v>0){lo=Math.min(lo,l.v);hi=Math.max(hi,l.v);}});
  const pad=(hi-lo)*.06||1e-6; lo-=pad; hi+=pad; const Y=p=>((hi-p)/(hi-lo)*H).toFixed(1), cw=W/pts.length;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px" role="img" aria-label="5-minute candles">`;
  if(opt.news){ const i=pts.findIndex(p=>p.t&&Math.abs(p.t-opt.news)<150000); if(i>=0) s+=`<rect x="${(i*cw).toFixed(1)}" y="0" width="${cw.toFixed(1)}" height="${H}" fill="#7FB2FF" fill-opacity=".14"/>`; }
  pts.forEach((p,i)=>{const col=p.c>=p.o?"#2EC4A6":"#FF8A4C",x=i*cw;
    s+=`<line x1="${(x+cw/2).toFixed(1)}" x2="${(x+cw/2).toFixed(1)}" y1="${Y(p.h)}" y2="${Y(p.l)}" stroke="${col}"/>`+
       `<rect x="${(x+cw*.15).toFixed(1)}" y="${Y(Math.max(p.o,p.c))}" width="${(cw*.7).toFixed(1)}" height="${Math.max(1,Math.abs(Y(p.o)-Y(p.c))).toFixed(1)}" fill="${col}"/>`;});
  (opt.lines||[]).forEach(l=>{ if(l.v>0) s+=`<line x1="0" x2="${W}" y1="${Y(l.v)}" y2="${Y(l.v)}" stroke="${l.c}" stroke-width="1.2" ${l.d?'stroke-dasharray="4 3"':""}/>`; });
  // entry / exit markers: dotted vertical line at the candle + a triangle at the price (up = buy, down = sell)
  (opt.marks||[]).forEach(m=>{ if(!m.t||!(m.v>0)) return; let i=-1,best=1e18; pts.forEach((p,k)=>{ const d=Math.abs(p.t-m.t); if(+p.t<=+m.t+60000&&d<best){best=d;i=k;} }); if(i<0) return;
    const x=(i*cw+cw/2), y=+Y(m.v), sz=Math.max(5,Math.min(9,cw*.9)), hx=sz*.8;
    s+=`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="0" y2="${H}" stroke="${m.c}" stroke-opacity=".55" stroke-dasharray="2 3"/>`;
    const tri=m.up?`${(x-hx).toFixed(1)},${(y+sz*1.6).toFixed(1)} ${(x+hx).toFixed(1)},${(y+sz*1.6).toFixed(1)} ${x.toFixed(1)},${(y+2).toFixed(1)}`
                 :`${(x-hx).toFixed(1)},${(y-sz*1.6).toFixed(1)} ${(x+hx).toFixed(1)},${(y-sz*1.6).toFixed(1)} ${x.toFixed(1)},${(y-2).toFixed(1)}`;
    s+=`<polygon points="${tri}" fill="${m.c}" stroke="#0B0F14" stroke-width="1"><title>${esc(m.label||"")}</title></polygon>`; });
  return s+"</svg>"; }
// ---------- data helpers
function rel(tag){ return (S.releases||[]).find(r=>r.release===tag); }
function relCands(tag){ return (S.candidates||[]).filter(c=>c.release===tag); }
function tradeGroups(){ const g={}; (S.trades||[]).forEach(r=>{ const tag=r.tag||""; if(!tag.startsWith("NC|")) return; (g[tag+"#"+r.symbol]=g[tag+"#"+r.symbol]||{tag,sym:r.symbol,rows:[]}).rows.push(r); });
  return Object.values(g).map(x=>{ const op=x.rows.find(r=>r.event==="OPEN"||r.event==="FILL")||{}, ex=x.rows.filter(r=>r.event==="EXIT"||r.event==="CLOSE").pop();
    const parts=x.tag.split("|"), relTag=parts.slice(2).join("|"); let R=null,why="open"; if(ex){ const m=(ex.note||"").match(/R=(-?[\d.]+)/); R=m?+m[1]:null; why=(ex.note||"").split(" ")[0]; }
    return {...x,plan:parts[1],relTag,open:op,exit:ex,R,why,t:srvDate(op.time_server)}; }).filter(x=>x.open.time_server).sort((a,b)=>b.t-a.t); }
function upcomingNext(){ const now=Date.now(); return (S.upcoming||[]).map(u=>({...u,t:srvDate(u.time_server)})).filter(u=>u.t&&u.t>now-600000).sort((a,b)=>a.t-b.t); }
function allEvents(){ const ev=[]; (S.schedule||[]).forEach(u=>ev.push({ccy:u.currency,name:u.release,t:srvDate(u.time_server),done:u.status==="released",key:u.key,act:u.actual,cons:u.consensus,up:u.upper,lo:u.lower,sched:1}));
  (S.upcoming||[]).forEach(u=>ev.push({ccy:u.currency,name:u.release,t:srvDate(u.time_server),done:false,key:u.key,cons:u.consensus,up:u.upper,lo:u.lower}));
  (S.releases||[]).forEach(r=>ev.push({ccy:r.currency,name:r.name,t:srvDate(r.time_server),done:true,key:r.release,act:r.actual,cons:r.consensus,plan:r.plan}));
  const rank=e=>e.plan?3:(e.sched?(e.done?2:0):1); const m={}; ev.forEach(e=>{ if(!e.t) return; const k=e.ccy+e.name+e.t.toDateString(); if(!m[k]||rank(e)>rank(m[k])||(rank(e)===rank(m[k])&&e.cons&&!m[k].cons)) m[k]=e; }); return Object.values(m).filter(e=>e.t).sort((a,b)=>a.t-b.t); }
// ---------- views
function vOverview(){ const st=S.status||{}, nx=upcomingNext()[0], tg=tradeGroups().slice(0,8), pos=st.positions||[];
  const cd=nx?Math.max(0,nx.t-Date.now()):0, cds=nx?`${Math.floor(cd/864e5)}d ${String(Math.floor(cd%864e5/36e5)).padStart(2,"0")}:${String(Math.floor(cd%36e5/6e4)).padStart(2,"0")}`:"-";
  const wk=[]; const base=new Date(); base.setHours(0,0,0,0); const evs=allEvents(); for(let i=0;i<5;i++){ const d=new Date(base.getTime()+i*864e5); wk.push({d,evs:evs.filter(e=>e.t.toDateString()===d.toDateString())}); }
  return `${banner()}
  <section class="card" style="display:flex;flex-wrap:wrap;gap:24px;align-items:center">
   <div style="flex:1 1 300px"><div class="lbl">Next release</div><div style="font-size:24px;font-weight:700;margin-top:6px">${nx?esc(nx.currency+" "+nx.release):"Nothing scheduled this week"}</div>
   <div class="muted" style="margin-top:4px">${nx?fmt(nx.t)+" · "+nyt(nx.t)+" New York":"The feed loads Sunday for the coming week"}</div></div>
   <div style="display:flex;flex-wrap:wrap;gap:26px"><div><div class="lbl">Countdown</div><div class="big">${cds}</div></div>
   <div><div class="lbl">Consensus</div><div class="big ${nx&&nx.consensus?"":"muted"}">${nx?(nx.consensus||"pending"):"-"}</div></div>
   <div><div class="lbl">Levels</div><div class="big" style="font-size:18px;margin-top:10px">${nx&&nx.upper?num(nx.lower,3)+" – "+num(nx.upper,3):"-"}</div></div></div>
   ${nx?`<button class="btn pri" onclick="selRel='${esc(nx.key)}';go('ev')">Open event</button>`:""}
  </section>
  <div class="row">
   <section class="card grow"><div style="display:flex;justify-content:space-between"><h2>Next 5 days</h2><a href="#cal" onclick="go('cal')">Full calendar</a></div>
    <div class="grid5">${wk.map(w=>`<div class="cell"><div class="lbl">${w.d.toLocaleDateString(undefined,{weekday:"short",day:"2-digit"})}</div>${w.evs.map(e=>`<div class="ev" onclick="selRel='${esc(e.key)}';go('ev')"><span class="mono muted">${hm(e.t)}</span> <b style="color:${CC[e.ccy]}">${e.ccy}</b> ${esc(e.name)}</div>`).join("")||'<div class="empty">-</div>'}</div>`).join("")}</div></section>
   <section class="card side"><h2>Account</h2>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px" class="mono">
     <div><div class="lbl">Balance</div><div style="font-size:19px">${num(st.balance)}</div></div><div><div class="lbl">Equity</div><div style="font-size:19px">${num(st.equity)}</div></div>
     <div><div class="lbl">Week DD</div><div style="font-size:19px">${num(st.dd_week)}% / ${num(st.settings&&st.settings.DD_WEEK,0)}%</div></div><div><div class="lbl">Month DD</div><div style="font-size:19px">${num(st.dd_month)}% / ${num(st.settings&&st.settings.DD_MONTH,0)}%</div></div></div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:16px">${st.paused?`<button class="btn pri" onclick="cmd('RESUME')">Resume entries</button>`:`<button class="btn" onclick="cmd('PAUSE')">Pause new entries</button>`}<button class="btn warn" onclick="cmd('CLOSE_ALL')">Close all positions</button></div>
    ${st.block?`<div class="banner" style="margin-top:12px">Entries blocked: ${esc(st.block)}</div>`:""}</section>
  </div>
  <div class="row">
   <section class="card grow"><h2>Open positions</h2>${pos.length?`<div class="scroll"><table class="mono"><tr><th>Symbol</th><th>Plan</th><th>Side</th><th>Lots</th><th>Entry</th><th>SL</th><th>TP</th><th>P/L</th><th></th></tr>${pos.map(p=>`<tr><td><b>${esc(p.symbol)}</b></td><td>${esc((p.tag||"").split("|")[1]||"")}</td><td>${p.dir}</td><td>${p.volume}</td><td>${p.open}</td><td class="neg">${p.sl}</td><td class="pos">${p.tp}</td><td class="${p.profit>=0?"pos":"neg"}">${num(p.profit)}</td><td><button class="btn" style="min-height:34px;padding:6px 10px" onclick="if(confirm('Close ${esc(p.symbol)}?'))cmd('CLOSE','${p.ticket}')">Close</button></td></tr>`).join("")}</table></div>`:'<div class="empty">No open positions.</div>'}
    ${(st.orders||[]).length?`<div class="lbl" style="margin-top:12px">Pending covers</div><div class="scroll"><table class="mono">${st.orders.map(o=>`<tr><td><b>${esc(o.symbol)}</b></td><td>${o.volume} lots</td><td>stop @ ${o.price}</td><td class="neg">SL ${o.sl}</td><td class="pos">TP ${o.tp}</td></tr>`).join("")}</table></div>`:""}

// ===================== charts for every system (v4b) =====================
let swSel=null;
function swChart(px,t,closed){ const ot=closed?t.open_server:t.opened, rows=csvRows(fileTxt(px+"snap_"+String(ot||"").replace(/[.: ]/g,"")+".csv"));
  if(!rows.length) return `<div class="empty">No chart saved for this trade yet (charts start from ${px==="RS_"?"RSI(2) v1.02":"gold inside-day v1.03"}).</div>`;
  const L=isLong(t.dir||"long"), sl=+(t.stop||t.sl), lines=[{v:+t.entry,c:"#E6EAF0"},{v:sl,c:"#FF8A4C",d:1}], marks=[{t:srvDate(ot),v:+t.entry,c:"#E6EAF0",up:L,label:"Entry"}];
  if(closed){ lines.push({v:+t.exit,c:"#7FB2FF"}); marks.push({t:srvDate(t.close_server),v:+t.exit,c:"#7FB2FF",up:!L,label:"Exit"}); }
  return candles(rows,{W:900,H:240,lines,marks})+`<div class="lg"><span>1-hour candles</span><span><b style="color:#E6EAF0">▲▼</b> entry (▲ buy, ▼ sell)</span><span><b style="color:#FF8A4C">- -</b> ${closed?"first ":""}stop</span>${closed?'<span><b style="color:#7FB2FF">▲▼ —</b> exit</span>':""}</div>`; }
function swRow(px,t,i,cols){ const id=px+i, open=swSel===id;
  return [`style="cursor:pointer" onclick="swSel=${open?"null":`'${id}'`};draw()"`, open?`<tr><td colspan="${cols}" style="padding:10px 4px 16px">${swChart(px,t,true)}</td></tr>`:""]; }
function ncShadowChart(x){ const rows=csvRows(fileTxt("NC_snap_"+String(x.release).replace(/[^A-Za-z0-9_]/g,"")+"_"+String(x.symbol).replace(/[^A-Za-z0-9_.]/g,"")+".csv"));
  if(!rows.length) return `<div class="empty">No chart saved for this release.</div>`;
  const L=isLong(x.dir), e=+x.entry, sl=+x.sl, tp=+x.tp, te=srvDate(x.exit_time);
  let xp=x.exit_type==="TP"?tp:(x.exit_type==="SL"?sl:(x.exit_type==="BE"?e:0)); if(!xp&&te){ let b=null; rows.forEach(r=>{ const d=srvDate(r.time_server); if(d&&d<=te) b=r; }); xp=b?+b.close:0; }
  const r=rel(x.release), news=r?srvDate(r.time_server):null;
  return candles(rows,{W:900,H:240,news,lines:[{v:e,c:"#E6EAF0",d:1},{v:sl,c:"#FF8A4C"},{v:tp,c:"#2EC4A6"}],marks:[{t:srvDate(x.entry_time),v:e,c:"#E6EAF0",up:L,label:"Entry"}].concat(te&&xp?[{t:te,v:xp,c:"#7FB2FF",up:!L,label:"Exit "+x.exit_type}]:[])})+
   `<div class="lg"><span>5-minute candles · news candle shaded</span><span><b style="color:#E6EAF0">▲▼</b> entry</span><span><b style="color:#7FB2FF">▲▼</b> exit (${esc(x.exit_type)})</span><span class="neg">— SL</span><span class="pos">— TP</span></div>`; }
function ncOpenMark(p){ const r=(S.trades||[]).filter(t=>t.symbol===p.symbol&&(t.event==="OPEN"||t.event==="FILL")&&(t.tag===p.tag||(p.tag&&t.tag.startsWith(p.tag))||!p.tag)).pop();
  return r?{t:srvDate(r.time_server),v:+p.open,c:"#E6EAF0",up:isLong(p.dir),label:"Entry"}:null; }
// ===================== unified trade log (v4) =====================
let LF={sys:"",mode:"",st:"",sym:"",dir:"",per:"30",n:150}, allSel=null;
const isLong=d=>/buy|long/i.test(d||"");
function allTrades(){ const out=[];
  const sc=S.sc||{}, rs=S.rs||{}, gi=S.gi||{};
  (sc.trades||[]).forEach(t=>out.push({sys:"Scalper",sub:t.module,mode:t.mode||"live",sym:t.symbol,long:isLong(t.dir),op:srvDate(t.open_server),cl:srvDate(t.close_server),entry:t.entry,exit:t.exit,R:t.R===""?null:+t.R,why:t.reason,id:"sc|"+scId(t.module,t.symbol,t.open_server),chart:()=>scChart(t,true)}));
  ((sc.status||{}).trades||[]).forEach(t=>out.push({sys:"Scalper",sub:t.module,mode:t.mode||"live",sym:t.symbol,long:isLong(t.dir),op:srvDate(t.opened),cl:null,entry:t.entry,exit:"",R:t.r_now===""?null:+t.r_now,why:"open",id:"sco|"+scId(t.module,t.symbol,t.opened),chart:()=>scChart(t,false)}));
  (rs.trades||[]).forEach(t=>{ const e=+t.entry, s=+t.stop, x=+t.exit, R=(e&&s&&e!==s&&x)?(x-e)/(e-s):null;
    out.push({sys:"RSI(2)",sub:"US500 dip",mode:"live",sym:t.symbol,long:true,op:srvDate(t.open_server),cl:srvDate(t.close_server),entry:t.entry,exit:t.exit,R,profit:t.profit,why:t.reason,id:"rs|"+t.open_server,chart:()=>swChart("RS_",t,true)}); });
  const rsp=(rs.status||{}).position; if(rsp) out.push({sys:"RSI(2)",sub:"US500 dip",mode:"live",sym:(rs.status||{}).symbol||"US500",long:true,op:srvDate(rsp.opened||rsp.open_server),cl:null,entry:rsp.entry||rsp.price,exit:"",R:null,profit:rsp.profit,why:"open",id:"rso",chart:()=>swChart("RS_",{...rsp,dir:"long"},false)});
  (gi.trades||[]).forEach(t=>out.push({sys:"Gold inside-day",sub:"breakout",mode:"live",sym:t.symbol,long:isLong(t.dir),op:srvDate(t.open_server),cl:srvDate(t.close_server),entry:t.entry,exit:t.exit,R:t.R===""?null:+t.R,profit:t.profit,why:t.reason,id:"gi|"+t.open_server,chart:()=>swChart("GI_",t,true)}));
  const gip=(gi.status||{}).position; if(gip) out.push({sys:"Gold inside-day",sub:"breakout",mode:"live",sym:(gi.status||{}).symbol||"XAUUSD",long:isLong(gip.dir),op:srvDate(gip.opened||gip.open_server),cl:null,entry:gip.entry||gip.price,exit:"",R:null,profit:gip.profit,why:"open",id:"gio",chart:()=>swChart("GI_",gip,false)});
  tradeGroups().forEach(t=>out.push({sys:"News & Cover",sub:"Plan "+t.plan,mode:"live",sym:t.sym,long:isLong(t.open.dir),op:t.t,cl:t.exit?srvDate(t.exit.time_server):null,entry:t.open.price,exit:t.exit?t.exit.price:"",R:t.R,why:t.exit?t.why:"open",id:"nc|"+t.tag+"#"+t.sym,nck:t.tag+"#"+t.sym}));
  (S.shadow||[]).forEach(x=>out.push({sys:"News & Cover",sub:"Plan "+x.plan+(x.breakeven&&x.breakeven!=="0"&&!/no/i.test(x.breakeven)?" · BE":"")+(x.role==="PICKED"?"":" · not picked"),mode:"shadow",sym:x.symbol,long:isLong(x.dir),op:srvDate(x.entry_time)||srvDate(x.release),cl:srvDate(x.exit_time),entry:x.entry,exit:"",R:x.result_R===""?null:+x.result_R,why:x.exit_type,id:"ncs|"+x.release+x.symbol+x.plan+x.breakeven+x.role,chart:()=>ncShadowChart(x)}));
  return out.sort((a,b)=>(b.op||0)-(a.op||0)); }
function lf(k,v){ LF[k]=v; LF.n=150; allSel=null; draw(); }
function vAll(){ const all=allTrades(), now=Date.now();
  const f=all.filter(t=>(!LF.sys||t.sys===LF.sys)&&(!LF.mode||t.mode===LF.mode)&&(!LF.st||(LF.st==="open"?!t.cl:!!t.cl))&&(!LF.sym||t.sym===LF.sym)&&(!LF.dir||(LF.dir==="long")===t.long)&&(!+LF.per||(t.op&&now-t.op<=+LF.per*86400000)));
  const closed=f.filter(t=>t.cl&&t.R!=null&&!isNaN(t.R)), tot=closed.reduce((a,t)=>a+t.R,0), w=closed.filter(t=>t.R>0).length;
  const opt=(k,list)=>`<select onchange="lf('${k}',this.value)" style="background:#0F141B;color:var(--tx);border:1px solid #2A3340;border-radius:6px;padding:8px;font:inherit;font-size:13px">${list.map(([v,n])=>`<option value="${esc(v)}" ${LF[k]===v?"selected":""}>${esc(n)}</option>`).join("")}</select>`;
  const syms=[...new Set(all.map(t=>t.sym).filter(Boolean))].sort();
  const bySys={}; closed.forEach(t=>{ const k=t.sys+" · "+t.mode; const o=bySys[k]=bySys[k]||{n:0,r:0,w:0}; o.n++; o.r+=t.R; if(t.R>0) o.w++; });
  const rows=f.slice(0,LF.n).map(t=>{ const open=allSel===t.id; let ex="";
    if(open){ ex=t.chart?t.chart():(t.nck?`<button class="btn" onclick="openTrade='${esc(t.nck)}';go('log')">Open chart in N&amp;C trades</button>`:`<div class="empty">No chart saved for this system yet.</div>`);
      ex=`<tr><td colspan="9" style="padding:10px 4px 16px">${ex}<div class="muted" style="font-size:12px;margin-top:8px">Entry ${esc(t.entry)} · Exit ${esc(t.exit||"-")} · ${esc(t.why||"")}${t.profit!=null&&t.profit!==""?" · "+sgn(t.profit,0," $"):""}</div></td></tr>`; }
    return `<tr style="cursor:pointer" onclick="allSel=${open?"null":`'${esc(t.id).replace(/'/g,"")}'`};draw()"><td class="mono muted" style="white-space:nowrap">${fmt(t.op)}</td><td>${esc(t.sys)}</td><td class="muted">${esc(t.sub)}</td><td><span class="tag" style="color:${t.mode==="live"?"#F2C94C":"#7FB2FF"};border-color:${t.mode==="live"?"#F2C94C":"#7FB2FF"}">${t.mode.toUpperCase()}</span></td><td class="mono">${esc(t.sym)}</td><td class="${t.long?"pos":"neg"}">${t.long?"▲ long":"▼ short"}</td><td class="mono muted" style="white-space:nowrap">${t.cl?fmt(t.cl):"open"}</td><td class="mono">${t.R==null||isNaN(t.R)?"-":sgn(t.R,2,"R")}</td><td class="muted" style="font-size:12px">${esc(t.why||"")}</td></tr>`+ex; }).join("");
  return `<h1>Trade log</h1><div class="muted" style="font-size:12px">Every trade on every system, live and shadow · tap a trade for its chart</div>
  <section class="card"><div style="display:flex;flex-wrap:wrap;gap:8px">
   ${opt("sys",[["","All systems"],["Scalper","Scalper"],["RSI(2)","RSI(2)"],["Gold inside-day","Gold inside-day"],["News & Cover","News & Cover"]])}
   ${opt("mode",[["","Live + shadow"],["live","Live only"],["shadow","Shadow only"]])}
   ${opt("st",[["","Open + closed"],["open","Open"],["closed","Closed"]])}
   ${opt("sym",[["","All symbols"]].concat(syms.map(x=>[x,x])))}
   ${opt("dir",[["","Long + short"],["long","Long"],["short","Short"]])}
   ${opt("per",[["1","Last 24 h"],["7","Last 7 days"],["30","Last 30 days"],["0","All time"]])}</div>
   <div class="grid5" style="grid-template-columns:repeat(4,minmax(0,1fr));margin-top:14px"><div><div class="lbl">Trades</div><div class="mono">${f.length}</div></div><div><div class="lbl">Win %</div><div class="mono">${closed.length?Math.round(w/closed.length*100)+"%":"-"}</div></div><div><div class="lbl">Total R</div><div class="mono">${closed.length?sgn(tot,2,"R"):"-"}</div></div><div><div class="lbl">Avg R</div><div class="mono">${closed.length?sgn(tot/closed.length,2,"R"):"-"}</div></div></div>
   ${Object.keys(bySys).length>1?`<div class="mono muted" style="font-size:12px;margin-top:10px;display:flex;flex-wrap:wrap;gap:4px 16px">${Object.entries(bySys).map(([k,o])=>`<span>${esc(k)}: ${o.n} · ${sgn(o.r,2,"R")}</span>`).join("")}</div>`:""}</section>
  <section class="card">${f.length?`<div class="scroll"><table><tr><th>Opened</th><th>System</th><th>Setup</th><th>Mode</th><th>Symbol</th><th>Dir</th><th>Closed</th><th>R</th><th>Exit</th></tr>${rows}</table></div>${f.length>LF.n?`<button class="btn" style="margin-top:12px" onclick="LF.n+=150;draw()">Show more (${f.length-LF.n} left)</button>`:""}`:'<div class="empty">No trades match these filters.</div>'}</section>`; }
// ---------------- Supabase data layer (v3) ----------------
const SB_URL="https://gxwrsrzpjnysekvayosn.supabase.co", SB_KEY="sb_publishable_JvhWGQ3s_TG_SiKn7FcnZQ_roIGJvEn";
const SB=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const FILES={}; let lastSeen=null, loading=false;
function fileTxt(n){ return (FILES[n]&&FILES[n].content)||""; }
function fileAge(n){ return FILES[n]?(Date.now()-Date.parse(FILES[n].updated_at))/1000:null; }
function csvRows(txt,last){ if(!txt||!txt.trim()) return []; const lines=txt.replace(/\r/g,"").split("\n").filter(l=>l.length);
  const split=l=>{ const out=[]; let cur="",q=false; for(let i=0;i<l.length;i++){ const ch=l[i]; if(q){ if(ch==='"'){ if(l[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; } else if(ch==='"') q=true; else if(ch===','){ out.push(cur); cur=""; } else cur+=ch; } out.push(cur); return out; };
  const h=split(lines[0]); let rows=lines.slice(1).map(l=>{ const v=split(l), o={}; h.forEach((k,i)=>o[k]=v[i]??""); return o; }); return last?rows.slice(-last):rows; }
function jsonFile(n){ try{ return JSON.parse(fileTxt(n)||"{}"); }catch(e){ return {}; } }
function eaFiles(p){ return {status:jsonFile(p+"status.json"),status_age:fileAge(p+"status.json"),trades:csvRows(fileTxt(p+"trades.csv")),signals:csvRows(fileTxt(p+"signals.csv")),cmd_results:csvRows(fileTxt(p+"command_results.csv"))}; }
function buildState(){
  const up={}; csvRows(fileTxt("NC_upcoming.csv")).forEach(r=>up[r.key]=r);
  const syms=fileTxt("NC_live_symbols.txt").split(",").map(x=>x.trim()).filter(Boolean), live={}; syms.forEach(x=>live[x]=csvRows(fileTxt("NC_live_"+x+".csv")));
  return {status:jsonFile("NC_status.json"),status_age:fileAge("NC_status.json"),common:"Supabase",
    upcoming:Object.values(up).sort((a,b)=>(a.time_server||"").localeCompare(b.time_server||"")),
    schedule:csvRows(fileTxt("NC_schedule.csv")),releases:csvRows(fileTxt("NC_releases.csv")),candidates:csvRows(fileTxt("NC_candidates.csv")),
    trades:csvRows(fileTxt("NC_trades.csv")),shadow:csvRows(fileTxt("NC_shadow.csv")),cmd_results:csvRows(fileTxt("NC_command_results.csv")),
    live,news:jsonFile("news.json"),sc:eaFiles("SC_"),rs:eaFiles("RS_"),gi:eaFiles("GI_")}; }
async function load(){ if(loading) return; loading=true;
  try{ let q=SB.from("term_files").select("name,content,updated_at").order("updated_at",{ascending:true}).limit(1000);
    if(lastSeen) q=q.gt("updated_at",lastSeen);
    const {data,error}=await q; if(error) throw error;
    (data||[]).forEach(r=>{ FILES[r.name]=r; if(!lastSeen||r.updated_at>lastSeen) lastSeen=r.updated_at; });
    S=buildState(); draw();
    if(data&&data.length===1000) setTimeout(load,200);
  }catch(e){ $("#k-st").innerHTML='<span class="dot" style="background:#FF8A4C"></span>Can\'t reach Supabase'; }
  finally{ loading=false; } }
async function signIn(){ $("#lmsg").textContent="Signing in…"; const {error}=await SB.auth.signInWithPassword({email:$("#le").value.trim(),password:$("#lp").value});
  if(error){ $("#lmsg").textContent=error.message; return; } start(); }
async function signUp(){ const email=$("#le").value.trim(), password=$("#lp").value; if(!email||password.length<8){ $("#lmsg").textContent="Enter your email and a password of 8+ characters first."; return; }
  const {data,error}=await SB.auth.signUp({email,password}); if(error){ $("#lmsg").textContent=error.message; return; }
  if(data.session) start(); else $("#lmsg").textContent="Account created. Check your email for the confirmation link, then sign in here."; }
async function signOut(){ await SB.auth.signOut(); location.reload(); }
let timer=null;
function start(){ $("#login").style.display="none"; navDraw(); load(); if(!timer) timer=setInterval(load,4000); }
SB.auth.getSession().then(({data})=>{ if(data.session) start(); else { $("#login").style.display="flex"; } });
</script>
